name: Afterplay CI - Quality & Integrity Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Unit Tests & Schema Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Execute Afterplay Business Rules & Integrity Tests
        run: |
          node -e "
            import('./tests/metrics.test.js').then(m => m.runAllTests()).then(res => {
              if (res.failed > 0) {
                console.error('CI Falhou: Testes com erro.');
                process.exit(1);
              } else {
                console.log('CI Sucesso: Todos os testes passaram!');
              }
            });
          "
