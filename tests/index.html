<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Afterplay — Suite de Testes Automatizados</title>
    <style>
        body {
            background-color: #0D0B0B;
            color: #F5F2EB;
            font-family: 'JetBrains Mono', monospace;
            padding: 32px;
            line-height: 1.6;
        }
        h1 {
            color: #F59E0B;
            font-size: 1.4rem;
            border-bottom: 1px solid #262120;
            padding-bottom: 12px;
        }
        .pass { color: #10B981; }
        .fail { color: #EF4444; }
        .summary {
            margin-top: 24px;
            padding: 16px;
            background: #171413;
            border: 1px solid #262120;
            border-radius: 8px;
        }
        #output {
            white-space: pre-wrap;
            background: #12100F;
            padding: 16px;
            border-radius: 8px;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <h1>💽 AFTERPLAY — SUÍTE DE TESTES UNITÁRIOS DE MÉTRICAS</h1>
    <div id="output">Inicializando testes...</div>
    <div id="summary" class="summary"></div>

    <script type="module">
        import { runAllTests } from './metrics.test.js';

        const out = document.getElementById('output');
        const summary = document.getElementById('summary');
        
        let logs = [];
        const originalLog = console.log;
        const originalErr = console.error;

        console.log = (...args) => {
            logs.push(`<span class="pass">${args.join(' ')}</span>`);
            originalLog(...args);
        };
        console.error = (...args) => {
            logs.push(`<span class="fail">${args.join(' ')}</span>`);
            originalErr(...args);
        };

        runAllTests().then(result => {
            out.innerHTML = logs.join('\n');
            summary.innerHTML = `<strong>Resultado Final:</strong> ${result.passed} passaram, ${result.failed} falharam.`;
            summary.style.borderColor = result.failed === 0 ? '#10B981' : '#EF4444';
        });
    </script>
</body>
</html>
